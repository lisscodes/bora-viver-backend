services:
  postgres:
    image: postgres:16-alpine
    container_name: bora-viver-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-bora}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bora}
      POSTGRES_DB: ${DB_NAME:-bora_viver}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - bora_viver_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bora_viver_pgdata:
